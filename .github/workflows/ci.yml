name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
jobs:
  fast:                      # scoped to the files the push changed; seconds, never integration
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install -e ".[dev]"
      - run: python tools/scoped_tests.py HEAD~1
  slow:                      # integration (real boards, KiCad, Freerouting): manual / nightly only
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases && sudo apt-get update && sudo apt-get install -y kicad ngspice default-jre
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -m slow
